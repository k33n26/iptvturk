name: IPTV Auto Update

on:
  push:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt || true

      - name: Build playlist, stats, update README
        run: |
          python scripts/build_playlist.py
          python scripts/build_stats.py
          python scripts/bump_version.py
          python scripts/update_readme.py

      - name: Commit & Push
        run: |
          VERSION=$(cat VERSION.txt)
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "auto update v$VERSION" || true
          git push

      - name: Purge jsDelivr latest cache
        run: |
          curl -X GET https://purge.jsdelivr.net/gh/k33n26/iptvturk@latest/playlist.m3u
